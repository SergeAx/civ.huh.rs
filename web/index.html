<body>
  <!-- data-i18n lists the attributes whose (English) values main.js passes through t() -->
  <header id="topbar">
    <div class="brand"><span class="brand-emblem" aria-hidden="true">★</span><span class="brand-text"></span></div>
    <div id="yields" class="yields" aria-label="National yields" data-i18n="aria-label"></div>
    <div class="spacer"></div>
    <div class="search" role="search">
      <span class="search-ic" aria-hidden="true"></span>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" aria-label="Search cities and districts (/ or Ctrl K)" data-i18n="aria-label">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div id="turn" class="turn"></div>
    <div class="tb-buttons">
      <button id="btn-share" class="btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Share this view" title="Share: copy a link or download an image" data-i18n="aria-label,title"></button>
      <button id="btn-help" class="btn btn-icon" aria-label="Keyboard and mouse help" title="Help (?)" data-i18n="aria-label,title"></button>
      <button id="btn-pedia" class="btn" aria-label="Open the Almanac" title="What every number means and where it comes from" data-i18n="aria-label,title"></button>
      <button id="btn-lang" class="btn lang-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-pop"></button>
    </div>
  </header>

  <canvas id="map" role="img"></canvas>

  <div id="tooltip" class="tooltip" hidden></div>
  <aside id="city-panel" class="panel" hidden role="region" aria-label="Details" data-i18n="aria-label"></aside>

  <div id="lens-area">
    <div id="lens-picker" class="panel lens-picker" hidden role="dialog" aria-label="Choose a lens" data-i18n="aria-label"></div>
    <div id="legend" class="panel legend" hidden role="group" aria-label="Lens legend" data-i18n="aria-label"></div>
    <div id="lens-dock" class="panel lens-dock" role="toolbar" aria-label="Map lenses" data-i18n="aria-label">
      <button id="btn-res" class="lens-btn res-toggle" aria-pressed="true" aria-label="Resources on tiles (R)" title="Show or hide resources on tiles (R)" data-i18n="aria-label,title" hidden></button>
      <div id="lens-quick" class="lens-quick"></div>
      <button id="btn-lenses" class="lens-btn lens-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="lens-picker"></button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel"><canvas id="minimap" aria-label="Minimap: click to jump" data-i18n="aria-label" role="img"></canvas></div>
  <button id="btn-minimap" class="panel minimap-toggle" aria-pressed="false" aria-controls="minimap-wrap" aria-label="Show the minimap" data-i18n="aria-label"></button>

  <div id="search-results" class="panel search-results" role="listbox" aria-label="Search results" data-i18n="aria-label" hidden></div>
  <div id="share-pop" class="panel share-pop" role="dialog" aria-label="Share" data-i18n="aria-label" hidden></div>
  <div id="lang-pop" class="panel share-pop lang-pop" role="menu" aria-labelledby="btn-lang" hidden></div>
  <div id="yield-report" class="panel yield-report" role="dialog" aria-label="National report" data-i18n="aria-label" tabindex="-1" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="pedia" class="modal" hidden>
    <div class="modal-card panel" role="dialog" aria-modal="true" aria-label="Almanac" data-i18n="aria-label">
      <button class="close icon-btn" data-close aria-label="Close the Almanac" data-i18n="aria-label">✕</button>
      <nav id="pedia-nav" aria-label="Almanac pages" data-i18n="aria-label"></nav>
      <article id="pedia-body"></article>
    </div>
  </div>

  <div id="help" class="modal" hidden>
    <div class="help-card panel" role="dialog" aria-modal="true" aria-labelledby="help-title"></div>
  </div>

  <div id="loading">…</div>
  <script type="module" src="js/main.js"></script>
</body>
